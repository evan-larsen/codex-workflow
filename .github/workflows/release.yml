name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CODEX_WORKFLOW_PYTHON: python
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate package
        run: python workflow.py validate --package-root . --json

      - name: Build release assets
        run: python scripts/package.py --root . --output dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "codex_workflow $GITHUB_REF_NAME"
          --generate-notes
          dist/codex_workflow-*.zip
          dist/SHA256SUMS
